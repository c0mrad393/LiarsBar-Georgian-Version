<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0906" />
    <meta name="robots" content="noindex" />
    <title>მატყუარას ბარი · 3D ტესტი</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@700;900&family=Noto+Serif+Georgian:wght@900&display=swap" />
    <style>
      :root { --ink: #1c1510; --paper: #f7eedb; --sun: #eab54a; --coral: #c23b2e; --green: #3f7d4c; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0906; color: var(--paper);
        font-family: "Noto Sans Georgian", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      .ui { position: fixed; z-index: 5; pointer-events: none; }
      .ui > * { pointer-events: auto; }
      #top { top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .chip { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 #000; white-space: nowrap; }
      a.chip { text-decoration: none; }
      .tag { background: #7a2c54; color: #fff; }
      #toast { top: 96px; left: 50%; transform: translateX(-50%); width: min(92vw, 420px); text-align: center; }
      #toast div { display: inline-block; background: #000a; border: 1.5px solid #ffffff22; border-radius: 14px; padding: 6px 12px; font-size: 13px; font-weight: 700; margin-top: 4px; animation: pop .3s cubic-bezier(.2,.9,.3,1.3) both; }
      #bottom { left: 10px; right: 10px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
      button.btn { font: inherit; font-weight: 900; font-size: 17px; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px; box-shadow: 0 5px 0 #000; cursor: pointer; flex: 1; max-width: 220px;
        transition: transform .35s cubic-bezier(.34,1.9,.5,1); }
      button.btn:active:not(:disabled) { transform: translateY(4px) scale(.96,.92); box-shadow: 0 1px 0 #000; transition-duration: .06s; }
      button.btn:disabled { opacity: .35; }
      .liar { background: var(--coral); color: #fff; }
      .play { background: var(--sun); color: var(--ink); }
      .pull { background: var(--coral); color: #fff; position: relative; overflow: hidden; max-width: 320px; }
      .pull i { position: absolute; inset: 0 auto 0 0; width: 0; background: #8f2420; }
      .pull span { position: relative; }
      #status { top: calc(max(10px, env(safe-area-inset-top)) + 46px); left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-shadow: 0 2px 4px #000; white-space: nowrap; }
      #flash { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: #fff; opacity: 0; }
      #over { inset: 0; display: none; align-items: center; justify-content: center; background: #000a; }
      #over .card { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 24px; padding: 22px; text-align: center; box-shadow: 0 6px 0 #000; min-width: 260px; }
      #over h2 { font-family: "Noto Serif Georgian", serif; margin: 0 0 12px; }
      #help { top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; width: min(88vw, 360px); box-shadow: 0 6px 0 #000; font-size: 14px; line-height: 1.5; }
      #help b { font-family: "Noto Serif Georgian", serif; font-size: 18px; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="flash"></div>
    <div class="ui" id="top">
      <a class="chip" href="./">← მთავარი</a>
      <span class="chip" id="table"></span>
      <span class="chip tag">3D</span>
    </div>
    <div class="ui" id="toast"></div>
    <div class="ui" id="status"></div>
    <div class="ui" id="bottom"></div>
    <div class="ui" id="over"><div class="card"><h2 id="winner"></h2><button class="btn play" id="again">🔁 კიდევ ერთი</button></div></div>
    <div class="ui" id="help">
      <b>🎲 3D მაგიდა: ტესტი</b><br />
      შენ მაგიდასთან ზიხარ, ბოტების პირისპირ. <br />
      • შენს სვლაზე <b style="font-size:14px">შეეხე კარტებს</b> ქვემოთ და დააჭირე „დადებას“.<br />
      • თითის გადატარებით ოთახში მიმოიხედავ.<br />
      • რევოლვერთან: დააჭირე და გააჩერე ღილაკი.<br /><br />
      <button class="btn play" id="go" style="width:100%;max-width:none">დავიწყოთ! 🍷</button>
    </div>
    <script type="module" src="/src/table3d/main.js"></script>
  </body>
</html>
